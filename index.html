<script>
'use strict';
const VERSION=2;
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Sydney',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const daysAgo=n=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-n);return localDate(d)};
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const formatDate=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}catch{return d}};
const num=(n,f=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString('en-AU',{maximumFractionDigits:f,minimumFractionDigits:f}):'—';
const val=(n,backup=0)=>Number.isFinite(+n)&&n!==''&&n!=null?+n:backup;
const round=(n,d=1)=>Math.round(n*10**d)/10**d;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const initial=()=>({version:VERSION,profile:{name:'Sujan',dob:'2006-02-14',height:172,referenceWeight:87.75,weight:'',waist:'',sex:'',goal:80,goal2:75,activity:'',work:'Physically active work; college student',diet:'',allergies:'',health:'',experience:'',gymdays:'',foodBudget:'',sleepTarget:8},settings:{calorieOverride:'',proteinOverride:'',waterTarget:2500,habits:['Drink water','Eat protein with meals','Move or train','Sleep routine']},foods:[],water:[],steps:[],workouts:[],basketball:[],swimming:[],body:[],recovery:[],calendar:[],habits:[],meals:[],photos:[],mealPlan:[],coaching:[],audit:[]});
let DB=initial(), current='dashboard', selectedDate=today(), menu=false, foodSearch='', toastTimer, editing={}, storeMode='initialising';
const nav=[['dashboard','◈','Dashboard'],['nutrition','◉','Food & Nutrition'],['gym','▥','Gym'],['basketball','🏀','Basketball'],['swimming','🏊','Swimming'],['body','◫','Body Progress'],['recovery','☾','Recovery'],['calendar','▦','Calendar'],['analytics','▤','Analytics'],['coach','✦','Coach'],['settings','⚙','Settings']];
const FOOD=[
 ['Cooked white rice',130,2.7,28.2,.3,0.4,'Cooked, USDA-based estimate'],['Cooked brown rice',123,2.7,25.6,1,1.6,'Cooked estimate'],['Dal (lentil soup)',106,6.6,16.2,1.8,5.3,'Recipe estimate; varies with oil'],['Tarkari (mixed vegetable curry)',95,2.1,10,5.5,3,'Recipe estimate; varies'],['Chicken curry',160,16,5,8,1,'Recipe estimate; varies'],['Roti / chapati',265,8,53,4,7,'Dry equivalent; homemade varies'],['Steamed chicken momo',190,10,25,6,1.3,'Estimate; recipe varies'],['Chiura (beaten rice)',360,7,80,1,2,'Dry, estimate'],['Plain Greek yoghurt',97,9,4,5,.0,'Generic estimate; read packaging'],['Egg whole',143,12.6,.7,9.5,0,'Generic cooked weight estimate'],['Chicken breast cooked',165,31,0,3.6,0,'Cooked, generic'],['Tuna in springwater',110,25,0,1,0,'Drained estimate'],['Banana',89,1.1,23,.3,2.6,'Raw generic'],['Apple',52,.3,13.8,.2,2.4,'Raw generic'],['Oats (dry)',389,16.9,66.3,6.9,10.6,'Dry generic'],['Milk reduced fat',50,3.5,5,1.8,0,'Generic milk estimate'],['Tofu firm',144,17,3,8.7,2.3,'Generic estimate'],['Broccoli cooked',35,2.4,7.2,.4,3.3,'Generic'],['Potatoes boiled',87,1.9,20.1,.1,1.8,'Generic'],['Peanut butter',588,25,20,50,6,'Generic; packaging differs'],['Wholemeal bread',247,13,41,4.2,7,'Generic'],['Whey protein powder',400,80,8,6,0,'Generic; check label'],['Paneer',265,18,3.6,20.8,0,'Generic estimate'],['Mince beef cooked lean',215,26,0,12,0,'Generic'],['Orange',47,.9,12,.1,2.4,'Raw generic'],['Avocado',160,2,8.5,14.7,6.7,'Raw generic'],['Salmon cooked',206,22,0,12,0,'Generic'],['Mixed nuts',607,20,21,54,8,'Generic estimate']
];
let foods=FOOD.map((x,i)=>({id:'builtin'+i,name:x[0],kcal:x[1],protein:x[2],carbs:x[3],fat:x[4],fibre:x[5],source:x[6],unit:'100 g'}));
function notify(message){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3600)}
function byDate(arr,date=selectedDate){return arr.filter(x=>x.date===date)}
function sum(arr,key){return arr.reduce((a,x)=>a+val(x[key]),0)}
function sorted(arr){return [...arr].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))}
function latestWeight(){const b=sorted(DB.body).find(x=>val(x.weight)>0);return b?+b.weight:(val(DB.profile.weight)>0?+DB.profile.weight:null)}
function profileReady(){return !!(DB.profile.sex&&latestWeight()&&DB.profile.activity)}
function estimate(){const p=DB.profile,w=latestWeight();if(!profileReady())return null;const age=(new Date().getFullYear()-Number(p.dob.slice(0,4)))-(new Date().toISOString().slice(5,10)<p.dob.slice(5)?1:0);const bmr=10*w+6.25*val(p.height)-5*age+(p.sex==='male'?5:-161);let factor={sedentary:1.25,light:1.4,moderate:1.55,active:1.7,very:1.85}[p.activity]||1.4;const tdee=Math.round(bmr*factor);const goal=val(DB.settings.calorieOverride)||Math.max(Math.round(bmr*1.2),tdee-Math.min(350,tdee*.15));const protein=val(DB.settings.proteinOverride)||Math.round(1.8*w);const fat=Math.max(45,Math.round(goal*.25/9));const carbs=Math.max(0,Math.round((goal-protein*4-fat*9)/4));return{age,bmr:Math.round(bmr),tdee,goal:Math.round(goal),protein,fat,carbs,fibre:30};}
function macroTotal(date=selectedDate){const a=byDate(DB.foods,date);return{calories:sum(a,'kcal'),protein:sum(a,'protein'),carbs:sum(a,'carbs'),fat:sum(a,'fat'),fibre:sum(a,'fibre')}}
function lastDays(arr,days){const cutoff=daysAgo(days-1);return arr.filter(x=>x.date>=cutoff&&x.date<=today())}
function weeklyAverageWeight(){const a=lastDays(DB.body,7).filter(x=>val(x.weight)>0);return a.length?round(sum(a,'weight')/a.length,2):null}
function ageText(){return new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Australia/Sydney'});}
function audit(type,action,rec){DB.audit.unshift({id:id(),type,action,recordId:rec.id,date:today(),at:new Date().toISOString()});DB.audit=DB.audit.slice(0,300)}
let dbConn=null, saveQueue=Promise.resolve();
function openDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('IndexedDB unavailable'));return}const req=indexedDB.open('sujan-fit-os',2);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data')};req.onerror=()=>reject(req.error);req.onsuccess=()=>resolve(req.result)})}
function dbRead(conn){return new Promise((resolve,reject)=>{const r=conn.transaction('data').objectStore('data').get('main');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbWrite(conn,data){return new Promise((resolve,reject)=>{const tx=conn.transaction('data','readwrite');tx.objectStore('data').put(data,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function mergeDefaults(data){const base=initial();if(!data||typeof data!=='object')return base;for(const k of Object.keys(base)){if(Array.isArray(base[k]))base[k]=Array.isArray(data[k])?data[k]:[];else if(typeof base[k]==='object')base[k]={...base[k],...(data[k]||{})}}base.version=VERSION;return base}
async function init(){try{dbConn=await openDb();DB=mergeDefaults(await dbRead(dbConn));storeMode='IndexedDB (offline)'}catch(e){try{const d=localStorage.getItem('sujan-fit-offline');DB=mergeDefaults(d?JSON.parse(d):null);storeMode='browser fallback (offline)'}catch{DB=initial();storeMode='memory only — export regularly';}}render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function persist(){const snapshot=JSON.parse(JSON.stringify(DB));saveQueue=saveQueue.then(async()=>{if(dbConn){await dbWrite(dbConn,snapshot)}else if(storeMode.startsWith('browser')){localStorage.setItem('sujan-fit-offline',JSON.stringify(snapshot))}}).catch(e=>{console.error(e);notify('Save failed. Export a backup immediately. Storage may be full.')});return saveQueue}
function add(table,record){const item={...record,id:id(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};DB[table].push(item);audit(table,'create',item);persist();return item}
function update(table,itemid,patch){const item=DB[table].find(x=>x.id===itemid);if(!item)return;Object.assign(item,patch,{updatedAt:new Date().toISOString()});audit(table,'update',item);persist()}
function remove(table,itemid){const item=DB[table].find(x=>x.id===itemid);if(!item)return;if(!confirm('Delete this entry?'))return;DB[table]=DB[table].filter(x=>x.id!==itemid);audit(table,'delete',item);persist();notify('Entry deleted');render()}
function setPage(page){current=page;editing={};menu=false;window.scrollTo({top:0,behavior:'instant'});render()}
function field(name,label,type='text',value='',attrs=''){return `<div class="field"><label for="${esc(name)}">${esc(label)}</label><input id="${esc(name)}" name="${esc(name)}" type="${type}" value="${esc(value)}" ${attrs}></div>`}
function selectField(name,label,opts,currentVal=''){return `<div class="field"><label for="${esc(name)}">${esc(label)}</label><select id="${esc(name)}" name="${esc(name)}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(currentVal)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function textField(name,label,value=''){return `<div class="field"><label for="${esc(name)}">${esc(label)}</label><textarea id="${esc(name)}" name="${esc(name)}">${esc(value)}</textarea></div>`}
function button(label,action,kind='secondary'){return `<button class="button ${kind}" data-action="${esc(action)}">${label}</button>`}
function stat(label,value,unit='',detail='',fill=null){return `<div class="card"><div class="small">${label}</div><div class="metric">${value}<span> ${unit}</span></div>${detail?`<div class="small">${detail}</div>`:''}${fill!==null?bar(fill):''}</div>`}
function bar(n){return `<div class="bar"><span style="width:${Math.min(100,Math.max(0,n))}%"></span></div>`}
function entry(item,subtitle,table,actions=true){return `<div class="entry"><div class="info"><b>${item}</b><small>${subtitle}</small></div>${actions?`<div class="actions"><button class="button smallbtn secondary" data-edit="${table}">Edit</button></div>`:''}</div>`}
function empty(msg){return `<div class="empty"><span class="big">◇</span>${esc(msg)}</div>`}
function render(){const app=document.getElementById('app');const titles={dashboard:'Your daily command centre',nutrition:'Food & Nutrition',gym:'Strength training',basketball:'Basketball performance',swimming:'Swimming performance',body:'Body transformation',recovery:'Sleep & recovery',calendar:'Calendar & schedule',analytics:'Your progress analytics',coach:'Your offline fitness coach',settings:'Profile, goals & privacy'};const subtitle={dashboard:'Your performance, fuel and recovery in one place.',nutrition:'Know what you eat, using realistic estimates.',gym:'Track your sets and build strength.',basketball:'Every game counts. Measure what improves.',swimming:'Track pace, laps and endurance.',body:'Focus on trends, not daily fluctuations.',recovery:'Better recovery supports better training.',calendar:'Plan around your real life.',analytics:'See what your records actually show.',coach:'Rule-based feedback from your saved data — not an online AI.',settings:'All of your data is stored on this device.'};

}
function progressCircle(frac,label,value){const pct=Math.min(100,Math.max(0,frac*100));return `<div class="circle"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="48" fill="none" stroke="#29394e" stroke-width="11"/><circle cx="60" cy="60" r="48" fill="none" stroke="#56b5ff" stroke-width="11" stroke-dasharray="${round(pct/100*301.59,1)} 301.59" stroke-linecap="round"/></svg><div class="inner"><strong>${value}</strong><small>${label}</small></div></div>`}
function lineChart(points,unit=''){if(points.length<2)return empty('Log at least two entries to display a trend.');const width=600,height=185,top=16,bottom=32,margin=31;const nums=points.map(p=>p.v),min=Math.min(...nums),max=Math.max(...nums),range=Math.max(1,max-min),minY=min-range*.16,maxY=max+range*.16;const xx=i=>margin+(width-margin*2)*i/(points.length-1),yy=v=>top+(height-top-bottom)*(maxY-v)/(maxY-minY);const p=points.map((v,i)=>`${xx(i)},${yy(v.v)}`).join(' ');return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Trend from ${num(points[0].v,1)} to ${num(points.at(-1).v,1)} ${unit}"><line x1="${margin}" x2="${width-margin}" y1="${height-bottom}" y2="${height-bottom}" stroke="#344860"/><line x1="${margin}" x2="${width-margin}" y1="${top}" y2="${top}" stroke="#273d52" stroke-dasharray="4 6"/><text x="3" y="${top+7}" class="axis">${num(maxY,1)}</text><text x="3" y="${height-bottom}" class="axis">${num(minY,1)}</text><polyline points="${p}" class="chartline"/>${points.map((v,i)=>`<circle cx="${xx(i)}" cy="${yy(v.v)}" r="3.8" fill="#7ceacb"><title>${esc(formatDate(v.date))}: ${num(v.v,1)} ${esc(unit)}</title></circle>`).join('')}<text x="${margin}" y="${height-9}" class="axis">${esc(formatDate(points[0].date))}</text><text x="${width-margin}" text-anchor="end" y="${height-9}" class="axis">${esc(formatDate(points.at(-1).date))}</text></svg></div>`}
function checklist(){const done=byDate(DB.habits),habits=DB.settings.habits||[];return `<div class="list">${habits.map((h,i)=>`<label class="habit"><span>${esc(h)}</span><input type="checkbox" data-habit="${i}" ${done.some(x=>x.name===h)?'checked':''}></label>`).join('')}</div>`}
function dashboardPage(){const e=estimate(),m=macroTotal(today()),w=latestWeight(),water=sum(byDate(DB.water,today()),'ml'),weeklyWorkouts=lastDays(DB.workouts,7).length,weeklySports=lastDays(DB.basketball,7).length+lastDays(DB.swimming,7).length,rv=sorted(DB.recovery)[0];const remain=e?Math.max(0,e.goal-m.calories):null;const done=byDate(DB.habits,today()).length;
return `<div class="card highlight hero"><div class="intro"><div class="eyebrow">${esc(ageText())}</div><h1>Hey, ${esc(DB.profile.name||'athlete')} <span class="blue">✦</span></h1><p>One good meal, one training session and one recovery choice at a time. Your entries are kept locally on this device.</p><div class="quick" style="margin-top:16px">${button('＋ Add food','gofood','primary')}${button('＋ Weigh in','goweight')}${button('＋ Add workout','goworkout')}${button('＋ Steps','stepsAdd')}</div></div><div class="pill">${DB.body.length+DB.foods.length+DB.workouts.length+DB.basketball.length+DB.swimming.length} saved logs</div></div>
${!profileReady()?`<div class="warning" style="margin-top:16px">⚠ Complete your profile: enter a fresh measured weight, sex used for metabolic calculations, and activity level before getting calorie estimates. ${button('Complete setup','settings')}</div>`:''}
<div class="section"><h2>Today's overview</h2><span class="small">${formatDate(today())}</span></div><div class="grid cols4">${stat('Current weight',w!==null?num(w,2):'—','kg',w===null?'Fresh weigh-in needed':`First goal ${num(DB.profile.goal)} kg`,w&&DB.profile.referenceWeight?100*Math.max(0,(DB.profile.referenceWeight-w))/(DB.profile.referenceWeight-DB.profile.goal||1):null)}${stat('Calories eaten',num(m.calories),'kcal',e?`${num(remain)} kcal remaining · target ${num(e.goal)}`:'Set up profile for target',e?m.calories/e.goal*100:null)}${stat('Protein',num(m.protein),'g',e?`of ${num(e.protein)} g goal`:'No target yet',e?m.protein/e.protein*100:null)}${stat('Water',num(water),'mL',`of ${num(DB.settings.waterTarget)} mL`,water/DB.settings.waterTarget*100)}</div>
<div class="grid cols2" style="margin-top:15px"><div class="card"><div class="cardhead"><h2>Nutrition today</h2>${button('Food diary','gofood','smallbtn secondary')}</div><div class="dashnutrition">${progressCircle(e?m.calories/e.goal:0,'eaten kcal',num(m.calories))}<div class="rest">${[['Protein',m.protein,e?.protein,'g'],['Carbs',m.carbs,e?.carbs,'g'],['Fat',m.fat,e?.fat,'g'],['Fibre',m.fibre,e?.fibre,'g']].map(([l,v,t,u])=>`<div class="ringlabels"><span class="small">${l}</span><b>${num(v,1)} / ${t??'—'} ${u}</b></div>${bar(t?v/t*100:0)}`).join('')}</div></div></div><div class="card"><div class="cardhead"><h2>Today's checklist</h2><span class="tag">${done}/${DB.settings.habits.length} complete</span></div>${checklist()}</div></div>
<div class="section"><h2>Performance & recovery</h2></div><div class="grid cols4">${stat('Steps today',num(sorted(byDate(DB.steps,today()))[0]?.count||0),'steps','Manual daily total')}${stat('Strength sessions',num(weeklyWorkouts),'this week','Last 7 days')}${stat('Sports sessions',num(weeklySports),'this week','Basketball + swimming')}${stat('Sleep',rv?num(rv.hours,1):'—','h',rv?`Last recorded ${formatDate(rv.date)}`:'Not logged')}${stat('Recovery',rv?`${num(rv.energy)}/5`:'—','','Energy, latest logged')}</div>
<div class="grid cols2" style="margin-top:15px"><div class="card"><div class="cardhead"><h2>Weight trend</h2>${button('Body records','goweight','smallbtn secondary')}</div>${lineChart(sorted(DB.body.filter(x=>val(x.weight)>0)).reverse().slice(-14).map(x=>({date:x.date,v:+x.weight})),'kg')}<small>7-day measured average: ${weeklyAverageWeight()===null?'not enough measurements':num(weeklyAverageWeight(),2)+' kg'}.</small></div><div class="card"><div class="cardhead"><h2>Guidance from your logs</h2>${button('Coach','gocoach','smallbtn secondary')}</div>${coachInsights().slice(0,3).map(x=>`<div class="coachdot"><span>${x.icon}</span><div><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div></div>`).join('')}</div></div>`}
function nutritionPage(){const e=estimate(),t=macroTotal(),dayEntries=sorted(byDate(DB.foods));const options=[['','Select a food'],...foods.map(f=>[f.id,f.name])];return `<div class="topline" style="margin-bottom:15px">${field('viewDate','Diary date','date',selectedDate)}${button('Today','todayDate')}</div><div class="grid cols4">${stat('Calories',num(t.calories),'kcal',e?`${num(e.goal-t.calories)} vs target`:'Target not yet calculated',e?t.calories/e.goal*100:null)}${stat('Protein',num(t.protein,1),'g',e?`Goal ${e.protein} g`:'')}${stat('Carbohydrates',num(t.carbs,1),'g',e?`Goal ${e.carbs} g`:'')}${stat('Fat',num(t.fat,1),'g',e?`Goal ${e.fat} g`:'')}</div><div class="grid cols2" style="margin-top:15px"><div class="card"><div class="cardhead"><h2>${editing.food?'Edit food entry':'Quick food entry'}</h2><span class="tag est">per-100-g estimates</span></div><form id="foodForm"><div class="fields">${selectField('foodSelect','Food database',options,editing.food?.foodId||'')}${field('foodName','Or custom food name','text',editing.food?.name||'','placeholder="e.g. Homemade dal bhat"')}${field('foodGrams','Portion (grams)','number',editing.food?.grams??'','min="1" max="10000" step="0.1" required')}${selectField('mealType','Meal',[['Breakfast','Breakfast'],['Lunch','Lunch'],['Dinner','Dinner'],['Snacks','Snacks'],['Drinks','Drinks']],editing.food?.meal||'Breakfast')}${field('foodDate','Date','date',editing.food?.date||selectedDate)}${field('foodCalories','Calories per 100 g','number',editing.food?.per100?.kcal??'','min="0" step="0.1" placeholder="Auto for library foods"')}${field('foodProtein','Protein per 100 g','number',editing.food?.per100?.protein??'','min="0" step="0.1" placeholder="Auto for library foods"')}${field('foodCarbs','Carbs per 100 g','number',editing.food?.per100?.carbs??'','min="0" step="0.1" placeholder="Auto for library foods"')}${field('foodFat','Fat per 100 g','number',editing.food?.per100?.fat??'','min="0" step="0.1" placeholder="Auto for library foods"')}${field('foodFibre','Fibre per 100 g','number',editing.food?.per100?.fibre??'','min="0" step="0.1" placeholder="Auto for library foods"')}</div><div class="notice">Built-in foods are generic reference estimates, not verified Australian product labels. Homemade dal, momo, curry and cooked weights vary substantially. For packaged products enter the label's values per 100 g.</div><div class="formactions"><button type="submit" class="button primary">${editing.food?'Save changes':'＋ Log food'}</button>${editing.food?button('Cancel','cancelFood'):''}</div></form></div><div class="card"><div class="cardhead"><h2>Water & daily totals</h2><span class="small">${formatDate(selectedDate)}</span></div><div class="metric">${num(sum(byDate(DB.water),'ml'))}<span> mL / ${num(DB.settings.waterTarget)} mL</span></div>${bar(sum(byDate(DB.water),'ml')/DB.settings.waterTarget*100)}<div class="quick" style="margin:12px 0 23px">${button('＋ 250 mL','water250','green')}${button('＋ 500 mL','water500','green')}${button('Custom','waterCustom')}</div>${[['Calories','kcal'],['Protein','protein'],['Carbs','carbs'],['Fat','fat'],['Fibre','fibre']].map(([n,k])=>`<div class="statline"><span>${n}</span><b>${num(t[k],1)} ${k==='kcal'?'kcal':'g'}</b></div>`).join('')}<div class="section"><h3>Water entries</h3></div><div class="list">${sorted(byDate(DB.water)).slice(0,8).map(x=>`<div class="entry"><div>${num(x.ml)} mL <small>${esc(x.time||'')}</small></div><button data-delete="water:${x.id}" class="linkbtn">Delete</button></div>`).join('')||empty('No water logged yet.')}</div></div></div>
<div class="section"><h2>Food diary</h2><small>${dayEntries.length} items</small></div><div class="grid cols2">${['Breakfast','Lunch','Dinner','Snacks','Drinks'].map(m=>`<div class="card"><div class="cardhead"><h3>${m}</h3><span class="small">${num(sum(dayEntries.filter(x=>x.meal===m),'kcal'))} kcal</span></div><div class="list">${dayEntries.filter(x=>x.meal===m).map(x=>`<div class="entry"><div class="info"><b>${esc(x.name)} · ${num(x.grams,0)} g</b><small>${num(x.kcal)} kcal · P ${num(x.protein,1)} g · C ${num(x.carbs,1)} g · F ${num(x.fat,1)} g</small><small>${esc(x.source||'Manual')}</small></div><div class="actions"><button class="linkbtn" data-edit-food="${x.id}">Edit</button><button class="linkbtn red" data-delete="foods:${x.id}">Delete</button></div></div>`).join('')||`<p class="small">Nothing logged.</p>`}</div></div>`).join('')}</div>
<div class="section"><h2>My custom food library</h2></div><div class="card"><form id="customFoodForm"><div class="fields three">${field('customName','Name','text','','required')}${field('customKcal','Calories / 100 g','number','','min="0" step="0.1" required')}${field('customProtein','Protein / 100 g','number',0,'min="0" step="0.1" required')}${field('customCarbs','Carbs / 100 g','number',0,'min="0" step="0.1" required')}${field('customFat','Fat / 100 g','number',0,'min="0" step="0.1" required')}${field('customFibre','Fibre / 100 g','number',0,'min="0" step="0.1" required')}</div><div class="formactions"><button class="button primary" type="submit">Save reusable food</button></div></form><div class="list" style="margin-top:12px">${DB.meals.filter(x=>x.kind==='food').map(x=>`<div class="entry"><span>${esc(x.name)} · ${num(x.kcal)} kcal/100g</span><button class="linkbtn" data-delete="meals:${x.id}">Delete</button></div>`).join('')}</div></div>`}
function gymPage(){const work=sorted(DB.workouts),sets=sum(DB.workouts,'sets'),volume=DB.workouts.reduce((a,x)=>a+val(x.sets)*val(x.reps)*val(x.kg),0),biggest=work.reduce((a,x)=>Math.max(a,val(x.kg)*(1+val(x.reps)/30)),0);return `<div class="grid cols4">${stat('Sessions logged',DB.workouts.length,'','All-time')}${stat('Working sets',num(sets),'sets','All-time')}${stat('Total volume',num(volume),'kg','Sets × reps × load')}${stat('Highest estimated 1RM',num(biggest,1),'kg','Epley formula, approximate')}</div><div class="grid cols2" style="margin-top:15px"><div class="card"><div class="cardhead"><h2>${editing.workout?'Edit exercise':'Log exercise / sets'}</h2><span class="tag">Your workout history</span></div><form id="workoutForm"><div class="fields">${field('gymDate','Date','date',editing.workout?.date||today(),'required')}${field('gymSession','Workout name','text',editing.workout?.session||'Full Body','required')}${selectField('gymExercise','Exercise',[['','Choose exercise'],...['Squat','Bench press','Deadlift','Overhead press','Pull-up','Lat pulldown','Seated row','Leg press','Romanian deadlift','Lunge','Calf raise','Biceps curl','Triceps extension','Plank','Box jump','Custom'].map(x=>[x,x])],(editing.workout?.custom?'Custom':editing.workout?.exercise)||'')}${field('gymCustom','Custom exercise (if selected)','text',editing.workout?.custom||'')}${field('gymSets','Working sets','number',editing.workout?.sets??3,'min="1" max="40" required')}${field('gymReps','Reps per set','number',editing.workout?.reps??8,'min="1" max="100" required')}${field('gymKg','Weight (kg)','number',editing.workout?.kg??0,'min="0" step="0.5" required')}${field('gymRpe','Effort RPE (1–10)','number',editing.workout?.rpe??7,'min="1" max="10" step="0.5"')}${textField('gymNotes','Notes',editing.workout?.notes||'')}</div><div class="formactions"><button class="button primary" type="submit">${editing.workout?'Save workout entry':'＋ Save exercise'}</button>${editing.workout?button('Cancel','cancelWorkout'):''}</div></form><div class="notice">One log represents one exercise with the specified sets, reps and load. For a workout with different exercises or loads, create more entries sharing the workout name/date.</div></div><div class="card"><div class="cardhead"><h2>Training suggestions</h2><span class="tag est">General guidance</span></div><div class="coachdot"><span>🏋️</span><div><b>Full-body strength</b><p>On 2–3 suitable days: squat / hinge / push / pull / core. Start conservatively and progressively increase reps or weight after consistent comfortable sessions.</p></div></div><div class="coachdot"><span>🏀</span><div><b>Basketball performance</b><p>Include controlled calf strengthening, landing mechanics and lateral movement. Avoid hard lower-body lifting immediately before demanding games when possible.</p></div></div><div class="coachdot"><span>⏳</span><div><b>Simple progression</b><p>When all sets feel comfortable at the top of a rep range and RPE stays moderate, consider the smallest available load increase.</p></div></div></div></div>
<div class="section"><h2>Exercise history</h2></div><div class="card"><div class="list">${work.slice(0,70).map(x=>`<div class="entry"><div class="info"><b>${esc(x.exercise)}</b><small>${esc(x.session)} · ${formatDate(x.date)} · ${num(x.sets)} × ${num(x.reps)} at ${num(x.kg,1)} kg · RPE ${num(x.rpe,1)}</small><small>Volume ${num(x.sets*x.reps*x.kg)} kg · estimated 1RM ${num(x.kg*(1+x.reps/30),1)} kg ${x.notes?'· '+esc(x.notes):''}</small></div><div class="actions"><button class="linkbtn" data-edit-workout="${x.id}">Edit</button><button class="linkbtn red" data-delete="workouts:${x.id}">Delete</button></div></div>`).join('')||empty('Log your first exercise to start tracking strength.')}</div></div>`}

function coachInsights(){const out=[],e=estimate(),m=macroTotal(today()),w=latestWeight(),rec=sorted(DB.recovery)[0],recent=lastDays(DB.body,21).filter(x=>val(x.weight)>0).sort((a,b)=>a.date.localeCompare(b.date));if(!profileReady())out.push({icon:'🧮',title:'Complete your calorie setup',body:'A fresh measured weight, sex for the formula, and activity category are needed. No calorie target is assumed.'});else{const diff=e.protein-m.protein;out.push({icon:'🥚',title:`Protein remaining: ${num(Math.max(0,diff))} g`,body:`Your estimated daily target is ${e.protein} g. Logged so far: ${num(m.protein,1)} g. Add missing meals to make the diary accurate.`});out.push({icon:'🍚',title:`Calories remaining: ${num(Math.max(0,e.goal-m.calories))} kcal`,body:`Target is about ${e.goal} kcal/day (estimated TDEE ${e.tdee}). This is a starting point, not an exact prescription. No activity calories are added back.`});}

 {name:'Boiled eggs and fruit',kcal:300,protein:17,carbs:25,fat:15,desc:'2 eggs (100 g edible), 180 g orange.',cost:2.3}
];
function newPlan(){const start=today();let days=[];const e=estimate(),goal=e?.goal||2200;for(let i=0;i<7;i++){const date=daysAgo(-i),keys=[i%2===0?0:1,i%2===0?2:3,i%2===0?4:8,i%2===0?6:7];let meals=keys.map((j,k)=>({...MEAL_TEMPLATES[j],id:id(),type:['Breakfast','Lunch','Dinner','Snack'][k]}));const total=sum(meals,'kcal'),scale=Math.min(1.3,Math.max(.8,goal/Math.max(1,total)));meals=meals.map(m=>({...m,kcal:Math.round(m.kcal*scale),protein:round(m.protein*scale),carbs:round(m.carbs*scale),fat:round(m.fat*scale),cost:round(m.cost*scale,2),scale:round(scale,2),desc:`${m.desc} Adjust all listed portions by roughly ×${round(scale,2)} (rough estimate).`}));days.push({date,meals})}DB.mealPlan=days;persist();notify('7-day sample plan created from general meal templates; adjust meals as needed.');render()}
function coachPage(){const e=estimate();return `<div class="card highlight"><div class="eyebrow">OFFLINE COACH · CLEARLY RULE-BASED</div><h2 style="margin-top:6px">Personal guidance from your saved entries</h2><p>This is not a cloud AI chatbot. It uses transparent calculations and the data you have recorded on this device. Recommendations are general, not medical diagnoses.</p></div><div class="grid cols2" style="margin-top:15px"><div class="card"><h2>Today's insights</h2>${coachInsights().map(x=>`<div class="coachdot"><span>${x.icon}</span><div><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div></div>`).join('')}</div><div class="card"><h2>Calorie & macro engine</h2>${e?`<div class="statline"><span>Mifflin–St Jeor basal estimate</span><b>${num(e.bmr)} kcal/day</b></div><div class="statline"><span>Estimated daily expenditure</span><b>${num(e.tdee)} kcal/day</b></div><div class="statline"><span>Conservative daily target</span><b>${num(e.goal)} kcal/day</b></div><div class="statline"><span>Protein</span><b>${num(e.protein)} g</b></div><div class="statline"><span>Carbs</span><b>${num(e.carbs)} g</b></div><div class="statline"><span>Fat</span><b>${num(e.fat)} g</b></div><div class="statline"><span>Fibre</span><b>~${num(e.fibre)} g</b></div><p class="small">Activity multiplier: ${esc(DB.profile.activity)}. An initial deficit of up to ~350 kcal is used; exercise sessions do not get added back. TDEE is a broad estimate, not automatically calibrated from your incomplete records.</p>`:`<div class="warning">Your estimate is not available until you enter a fresh weight, sex for calculation, and activity category.</div>${button('Set profile','settings','primary')}`}</div></div><div class="section"><h2>Editable 7-day meal plan</h2>${button('Generate example week','generatePlan','primary')}</div><div class="notice">Meal-plan nutrition, portions and Sydney grocery costs are rough template estimates, not verified nutrition analysis or live supermarket prices. Do not use a plan containing foods you are allergic to. You can swap meals and log them into your diary.</div>${DB.mealPlan.length?`<div class="mealgrid">${DB.mealPlan.map((day,i)=>`<div class="mealday"><h3>${formatDate(day.date)}</h3><span class="tag">${num(sum(day.meals,'kcal'))} kcal</span>${day.meals.map((m,j)=>`<div class="mealitem"><b>${esc(m.type)}</b><div>${esc(m.name)}</div><small>${num(m.kcal)} kcal · P ${num(m.protein)}g</small><p class="small pre">${esc(m.desc)}</p><div class="quick"><button class="linkbtn" data-replace="${i}:${j}">↻ Swap</button><button class="linkbtn" data-logplan="${i}:${j}">＋ Log</button></div></div>`).join('')}</div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="sideby"><h2>Estimated shopping spend</h2><strong>$${num(DB.mealPlan.reduce((a,d)=>a+sum(d.meals,'cost'),0),2)} AUD/week</strong></div><p>Indicative only. Pantry items, local pricing and waste change actual totals. Meals use rice, oats, eggs, lentils, chicken, vegetables, tofu, dairy and fruit.</p></div>`:empty('Generate your first example weekly meal plan, then swap individual meals.')}`}
function settingsPage(){const p=DB.profile,e=estimate();return `<div class="grid cols2"><div class="card"><div class="cardhead"><h2>Onboarding & editable profile</h2><span class="tag">Private</span></div><p>Your previous weight of approximately 87.75 kg is only a reference. Enter a fresh weight to activate nutrition estimates.</p><form id="profileForm"><div class="fields">${field('profileName','Preferred name','text',p.name,'required')}${field('profileDob','Date of birth','date',p.dob,'required')}${field('profileHeight','Height (cm)','number',p.height,'min="100" max="250" required')}${field('profileWeight','Fresh current weight (kg)','number',p.weight,'min="20" max="400" step="0.01" required')}${selectField('profileSex','Sex used for metabolic equation',[['','Select — do not assume'],['male','Male equation'],['female','Female equation']],p.sex)}${selectField('profileActivity','General baseline activity (includes usual work)',[['','Select activity level'],['sedentary','Mostly sitting'],['light','Lightly active'],['moderate','Moderately active'],['active','Very active / physical work'],['very','Extremely active']],p.activity)}${field('profileGoal','First goal weight (kg)','number',p.goal,'min="30" max="300" step="0.1" required')}${field('profileGoal2','Second goal weight (kg)','number',p.goal2,'min="30" max="300" step="0.1" required')}${field('profileWaist','Waist measurement (cm)','number',p.waist,'min="0" step="0.1"')}${field('profileBudget','Food budget per week (AUD)','number',p.foodBudget,'min="0" step="1"')}${selectField('profileExperience','Strength training experience',[['','Select'],['beginner','Beginner'],['intermediate','Intermediate'],['advanced','Advanced']],p.experience)}${field('profileDays','Available gym days','text',p.gymdays,'placeholder="e.g. Mon, Fri"')}${field('profileSleep','Sleep target (hours)','number',p.sleepTarget,'min="5" max="12" step="0.5"')}${textField('profileWork','Typical work & college commitments',p.work)}${textField('profileDiet','Diet preferences / disliked foods',p.diet)}${textField('profileAllergies','Allergies (do not rely on meal generator to screen)',p.allergies)}${textField('profileHealth','General health considerations (optional)',p.health)}</div><div class="formactions"><button type="submit" class="button primary">Save profile & recalculate estimates</button></div></form></div><div class="grid" style="align-content:start"><div class="card"><h2>Nutrition & habits</h2><form id="targetsForm" style="margin-top:14px"><div class="fields">${field('targetCalories','Daily calorie override (kcal; blank = estimate)','number',DB.settings.calorieOverride,'min="0" max="10000"')}${field('targetProtein','Protein override (g; blank = estimate)','number',DB.settings.proteinOverride,'min="0" max="500"')}${field('targetWater','Water target (mL)','number',DB.settings.waterTarget,'min="250" max="10000" required')}${textField('targetHabits','Daily habits (one per line)',DB.settings.habits.join('\n'))}</div><div class="formactions"><button type="submit" class="button primary">Save targets & habits</button></div></form><div class="notice">Calories are an estimate based on a standard equation and an activity-level assumption. No automatic workout-calorie addition.</div></div><div class="card"><h2>Data & privacy</h2><p><span class="live-dot"></span>${esc(storeMode)}. No account, cloud upload, analytics tracker or third-party scripts.</p><div class="quick" style="margin:14px 0">${button('Download complete backup','backup','primary')}${button('Export CSV','csv:foods')}</div><div class="field"><label for="importFile">Restore from exported JSON file</label><input id="importFile" type="file" accept="application/json,.json"></div><div class="formactions">${button('Restore / replace all','importReplace')}${button('Import / merge records','importMerge')}</div><p class="small">A backup contains personal health entries and photos, so keep the downloaded file private. Importing does not automatically sync multiple devices; export from one, import on another.</p><div class="formactions">${button('Delete all local data','resetAll','danger')}</div></div><div class="card"><h2>Free & offline limits</h2><div class="statline"><span>Internet required after first installation?</span><b>No</b></div><div class="statline"><span>Paid account / hosting?</span><b>No</b></div><div class="statline"><span>Automatic phone ↔ PC sync?</span><b>No</b></div><div class="statline"><span>Food barcode / photo AI?</span><b>Manual fallback</b></div><div class="statline"><span>Apple Health / Hevy live sync?</span><b>Not included</b></div><div class="statline"><span>Phone notifications while closed?</span><b>Not included</b></div><p class="small">Private-browser mode, clearing browser website data or deleting the app/browser profile may erase local entries. Export a backup often.</p></div></div></div>`}
function download(name,content,mime='application/json'){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download(`SUJAN-FIT-OS-backup-${today()}.json`,JSON.stringify({app:'SUJAN FIT OS Offline',exportedAt:new Date().toISOString(),data:DB},null,2));notify('Backup downloaded. Keep it private and safe.')}
function csv(table){const rows=DB[table];if(!rows?.length){notify('Nothing to export yet.');return}const keys=[...new Set(rows.flatMap(x=>Object.keys(x)))].filter(x=>x!=='data');const cell=x=>'"'+String(x??'').replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';const txt=[keys.map(cell).join(','),...rows.map(x=>keys.map(k=>cell(typeof x[k]==='object'?JSON.stringify(x[k]):x[k])).join(','))].join('\r\n');download(`${table}-${today()}.csv`,txt,'text/csv;charset=utf-8');notify('CSV downloaded')}
async function importBackup(merge){const inp=document.querySelector('#importFile'),file=inp?.files?.[0];if(!file){notify('Choose a JSON backup file first.');return}let other;try{const payload=JSON.parse(await file.text());other=payload.data||payload;if(!other.profile||!Array.isArray(other.foods)||!Array.isArray(other.body))throw Error('Unrecognised backup format')}catch{notify('Invalid backup JSON. Please select a SUJAN FIT OS backup.');return}
if(!confirm(merge?'Merge imported entries with local entries? Duplicate IDs will be updated from the newer version.':'Replace ALL data on this device with the backup? Current records will be lost.'))return;
if(merge){const newdb=mergeDefaults(other);for(const k of Object.keys(DB)){if(Array.isArray(DB[k])){const map=new Map(DB[k].map(x=>[x.id,x]));newdb[k].forEach(x=>{const old=map.get(x.id);if(!old||String(x.updatedAt||x.createdAt||'')>=String(old.updatedAt||old.createdAt||''))map.set(x.id,x)});DB[k]=[...map.values()]}else if(k==='profile'||k==='settings'){DB[k]={...DB[k],...newdb[k]}}}}else DB=mergeDefaults(other);
await persist();notify('Backup imported successfully');render()}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function asPositive(name,value,min=0,max=100000){const n=Number(value);if(!Number.isFinite(n)||n<min||n>max)throw Error(`${name} must be between ${min} and ${max}.`);return n}
function optionalNumber(v){return v===''||v==null?'':Number(v)}
function saveRecord(table,editKey,obj){if(editing[editKey])update(table,editing[editKey].id,obj);else add(table,obj);editing={};notify('Saved privately on this device');render()}
function scrollForm(){window.scrollTo({top:0,behavior:'smooth'})}
function editRecord(table,key,itemid){const found=DB[table].find(x=>x.id===itemid);if(!found)return;editing={[key]:found};render();scrollForm()}
function selectedFood(){const key=document.querySelector('#foodSelect')?.value;return foods.find(x=>x.id===key)}
function fillFoodLabels(){const f=selectedFood();if(!f)return;['Calories','Protein','Carbs','Fat','Fibre'].forEach((name)=>{const el=document.getElementById('food'+name);if(el)el.value=f[name==='Calories'?'kcal':name.toLowerCase()]});const n=document.querySelector('#foodName');if(n)n.value=''}
function doAction(action){if(action==='backup')return backup();if(action==='printReport')return window.print();if(action.startsWith('csv:'))return csv(action.slice(4));if(action==='mobilemenu'){menu=!menu;return render()}if(action==='settings')return setPage('settings');if(action==='gofood')return setPage('nutrition');if(action==='goweight')return setPage('body');if(action==='goworkout')return setPage('gym');if(action==='gocoach')return setPage('coach');if(action==='todayDate'){selectedDate=today();return render()}if(action==='stepsAdd'){let v=Number(prompt('Total steps today (e.g. 8500):',String(sorted(byDate(DB.steps,today()))[0]?.count||0)));if(!Number.isInteger(v)||v<0||v>100000){notify('Enter a valid daily step count');return}const prior=sorted(byDate(DB.steps,today()))[0];if(prior)update('steps',prior.id,{count:v});else add('steps',{date:today(),count:v});notify('Steps saved');return render()}if(action==='water250'||action==='water500'||action==='waterCustom'){let ml=action==='water250'?250:action==='water500'?500:Number(prompt('Water in mL (e.g. 350):'));if(!Number.isFinite(ml)||ml<=0||ml>5000)return;add('water',{date:selectedDate,time:new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}),ml});notify(`${ml} mL water logged`);return render()}
if(action.startsWith('cancel')){editing={};return render()}if(action==='generatePlan'){if(DB.profile.allergies?.trim()&&!confirm('The sample plan does NOT check allergies. Review all ingredients carefully. Continue?'))return;return newPlan()}
if(action==='importReplace'||action==='importMerge')return importBackup(action==='importMerge');if(action==='resetAll'){if(confirm('This permanently erases all local SUJAN FIT OS records on this device. Have you exported a backup?')&&prompt('Type DELETE to confirm:')==='DELETE'){DB=initial();selectedDate=today();editing={};persist().then(()=>{render();notify('Local data deleted')})}return}}
async function processPhoto(form){const f=form.querySelector('[name="photoUpload"]').files?.[0];if(!f||!f.type.startsWith('image/'))throw Error('Please choose an image file.');if(f.size>20*1024*1024)throw Error('Please choose an image under 20 MB.');const url=URL.createObjectURL(f);let imageEl;try{imageEl=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Could not read image'));im.src=url})}finally{URL.revokeObjectURL(url)}const max=900,scale=Math.min(1,max/Math.max(imageEl.width,imageEl.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(imageEl.width*scale));canvas.height=Math.max(1,Math.round(imageEl.height*scale));canvas.getContext('2d').drawImage(imageEl,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.7);add('photos',{date:form.photoDate.value,angle:form.photoAngle.value,data});notify('Progress photo saved locally');render()}
async function handleSubmit(form){const d=formData(form),n=(k,min=0,max=100000)=>asPositive(k,d[k],min,max);try{switch(form.id){
case 'foodForm':{
const selected=selectedFood(),customName=d.foodName.trim();if(!selected&&!customName)throw Error('Choose a food or enter its name.');const grams=n('foodGrams',.1,10000),base={kcal:n('foodCalories'),protein:n('foodProtein'),carbs:n('foodCarbs'),fat:n('foodFat'),fibre:n('foodFibre')};const factor=grams/100;let it={date:d.foodDate,meal:d.mealType,foodId:selected?.id||'',name:customName||selected?.name,grams,per100:base,source:selected?.source||'Manual entry',kcal:round(base.kcal*factor,1),protein:round(base.protein*factor,1),carbs:round(base.carbs*factor,1),fat:round(base.fat*factor,1),fibre:round(base.fibre*factor,1)};saveRecord('foods','food',it);break;}
case 'customFoodForm':{const f={kind:'food',name:d.customName.trim(),kcal:n('customKcal'),protein:n('customProtein'),carbs:n('customCarbs'),fat:n('customFat'),fibre:n('customFibre'),source:'Your custom food / label',unit:'100 g'};if(!f.name)throw Error('Enter food name');add('meals',f);notify('Custom food saved');render();break}
case 'workoutForm':{let exercise=d.gymExercise==='Custom'?d.gymCustom.trim():d.gymExercise;if(!exercise)throw Error('Select or name an exercise');saveRecord('workouts','workout',{date:d.gymDate,session:d.gymSession.trim(),exercise,custom:d.gymCustom.trim(),sets:n('gymSets',1,40),reps:n('gymReps',1,100),kg:n('gymKg',0,1000),rpe:d.gymRpe===''?7:n('gymRpe',1,10),notes:d.gymNotes.trim()});break}
case 'basketballForm':{const entry={date:d.bbDate,type:d.bbType,minutes:n('bbMinutes',1,600),fgm:n('bbFgm'),fga:n('bbFga'),threem:n('bb3m'),threea:n('bb3a'),ftm:n('bbFtm'),fta:n('bbFta'),points:n('bbPts'),rebounds:n('bbReb'),assists:n('bbAst'),steals:n('bbStl'),turnovers:n('bbTo'),rpe:n('bbRpe',1,10),notes:d.bbNotes.trim()};if(entry.fgm>entry.fga||entry.threem>entry.threea||entry.ftm>entry.fta||entry.threem>entry.fgm||entry.threea>entry.fga)throw Error('Makes cannot exceed attempts; 3-point shots must be part of field goals.');saveRecord('basketball','basketball',entry);break}
case 'swimmingForm':{saveRecord('swimming','swimming',{date:d.swimDate,stroke:d.swimStroke,pool:n('swimPool',10,100),distance:n('swimDistance',1,100000),minutes:n('swimMinutes',.1,1440),rpe:n('swimRpe',1,10),notes:d.swimNotes.trim()});break}
case 'bodyForm':{const weight=n('bodyWeight',20,400);const obj={date:d.bodyDate,weight,waist:optionalNumber(d.bodyWaist),hip:optionalNumber(d.bodyHip),chest:optionalNumber(d.bodyChest),arm:optionalNumber(d.bodyArm),thigh:optionalNumber(d.bodyThigh),notes:d.bodyNotes.trim()};saveRecord('body','body',obj);break}
case 'recoveryForm':{saveRecord('recovery','recovery',{date:d.recDate,hours:n('recHours',0,24),quality:n('recQuality',1,5),energy:n('recEnergy',1,5),soreness:n('recSoreness',1,5),stress:n('recStress',1,5),notes:d.recNotes.trim()});break}
case 'calendarForm':{if(!d.eventTitle.trim())throw Error('Enter event title');saveRecord('calendar','calendar',{date:d.eventDate,time:d.eventTime,title:d.eventTitle.trim(),category:d.eventCategory,minutes:n('eventMinutes',1,1440),repeat:d.eventRepeat,notes:d.eventNotes.trim()});break}
case 'profileForm':{const p=DB.profile;const previous=latestWeight();Object.assign(p,{name:d.profileName.trim(),dob:d.profileDob,height:n('profileHeight',100,250),weight:n('profileWeight',20,400),sex:d.profileSex,activity:d.profileActivity,goal:n('profileGoal',30,300),goal2:n('profileGoal2',30,300),waist:optionalNumber(d.profileWaist),foodBudget:optionalNumber(d.profileBudget),experience:d.profileExperience,gymdays:d.profileDays.trim(),sleepTarget:d.profileSleep===''?8:n('profileSleep',5,12),work:d.profileWork.trim(),diet:d.profileDiet.trim(),allergies:d.profileAllergies.trim(),health:d.profileHealth.trim()});if(previous===null||Math.abs(previous-p.weight)>0.001){add('body',{date:today(),weight:p.weight,waist:p.waist||'',hip:'',chest:'',arm:'',thigh:'',notes:'Fresh weight entered in onboarding/profile'})}persist();notify('Profile saved');render();break}
case 'targetsForm':{DB.settings.calorieOverride=d.targetCalories===''?'':n('targetCalories',0,10000);DB.settings.proteinOverride=d.targetProtein===''?'':n('targetProtein',0,500);DB.settings.waterTarget=n('targetWater',250,10000);DB.settings.habits=d.targetHabits.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,20);persist();notify('Targets saved');render();break}
case 'photoForm':{await processPhoto(form);break}
}}
catch(error){notify(error.message||'Could not save entry');console.error(error)}}
document.addEventListener('submit',e=>{if(e.target.matches('form')){e.preventDefault();handleSubmit(e.target)}});
document.addEventListener('click',e=>{const target=e.target.closest('[data-page], [data-action], [data-delete], [data-edit-food], [data-edit-workout], [data-edit-bb], [data-edit-swim], [data-edit-body], [data-edit-recovery], [data-edit-event], [data-range], [data-replace], [data-logplan]');if(!target)return;const a=target.dataset;if(a.page)return setPage(a.page);if(a.action)return doAction(a.action);if(a.delete){const [tab,itemid]=a.delete.split(':');if(DB[tab])remove(tab,itemid);return}if(a.editFood)return editRecord('foods','food',a.editFood);if(a.editWorkout)return editRecord('workouts','workout',a.editWorkout);if(a.editBb)return editRecord('basketball','basketball',a.editBb);if(a.editSwim)return editRecord('swimming','swimming',a.editSwim);if(a.editBody)return editRecord('body','body',a.editBody);if(a.editRecovery)return editRecord('recovery','recovery',a.editRecovery);if(a.editEvent)return editRecord('calendar','calendar',a.editEvent);if(a.range){window.reportRange=Number(a.range);return render()}
if(a.replace){const [i,j]=a.replace.split(':').map(Number),day=DB.mealPlan[i],currentMeal=day?.meals[j];if(!currentMeal)return;const choices=MEAL_TEMPLATES.filter(x=>x.name!==currentMeal.name);let k=choices.findIndex(x=>x.name===currentMeal.name)+1;let alternate=choices[Math.floor(Math.random()*choices.length)];const s=currentMeal.scale||1;day.meals[j]={...alternate,id:id(),type:currentMeal.type,kcal:Math.round(alternate.kcal*s),protein:round(alternate.protein*s),carbs:round(alternate.carbs*s),fat:round(alternate.fat*s),cost:round(alternate.cost*s,2),scale:s,desc:alternate.desc+' Portion multiplier ≈ '+s};persist();notify('Meal replaced');return render()}
if(a.logplan){const [i,j]=a.logplan.split(':').map(Number),day=DB.mealPlan[i],m=day?.meals[j];if(!m)return;add('foods',{date:day.date,meal:m.type==='Snack'?'Snacks':m.type,foodId:'',name:m.name,grams:null,source:'Generated sample meal estimate',kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,fibre:0,per100:null});notify('Meal added to food diary as an estimate');return render()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='foodSelect')return fillFoodLabels();if(el.id==='viewDate'){selectedDate=el.value||today();return render()}if(el.dataset.habit!==undefined){const name=DB.settings.habits[Number(el.dataset.habit)],exists=byDate(DB.habits,today()).find(x=>x.name===name);if(el.checked&&!exists)add('habits',{date:today(),name});if(!el.checked&&exists){DB.habits=DB.habits.filter(x=>x.id!==exists.id);persist()}return render()}});
const originalRender=render;
render=function(){foods=FOOD.map((x,i)=>({id:'builtin'+i,name:x[0],kcal:x[1],protein:x[2],carbs:x[3],fat:x[4],fibre:x[5],source:x[6],unit:'100 g'})).concat(DB.meals.filter(x=>x.kind==='food'));originalRender()};
init();
